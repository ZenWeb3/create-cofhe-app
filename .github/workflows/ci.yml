name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  scaffold:
    name: ${{ matrix.toolchain }} / ${{ matrix.pattern }}
    runs-on: ubuntu-latest
    needs: cli
    strategy:
      fail-fast: false
      matrix:
        toolchain: [hardhat, foundry]
        pattern: [blank, sealed-bid, private-vote, encrypted-token, encrypted-escrow]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: matrix.toolchain == 'foundry'
        uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Scaffold
        run: node dist/index.js app -t ${{ matrix.toolchain }} -f none -p ${{ matrix.pattern }} -m pnpm --no-git --no-install -y
      - name: Install project dependencies
        working-directory: app
        run: pnpm install --no-frozen-lockfile
      - name: Test project
        working-directory: app
        run: pnpm test

  add:
    name: ${{ matrix.toolchain }} / cofhe add
    runs-on: ubuntu-latest
    needs: cli
    strategy:
      fail-fast: false
      matrix:
        toolchain: [hardhat, foundry]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: matrix.toolchain == 'foundry'
        uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Scaffold a blank project
        run: node dist/index.js app -t ${{ matrix.toolchain }} -f none -p blank -m pnpm --no-git --no-install -y
      - name: Add every other pattern
        working-directory: app
        run: |
          for pattern in sealed-bid private-vote encrypted-token encrypted-escrow; do
            node ../dist/cli.js add "$pattern"
          done
      - name: Install project dependencies
        working-directory: app
        run: pnpm install --no-frozen-lockfile
      - name: Test project
        working-directory: app
        run: pnpm test
      - name: Deploy against a local node
        if: matrix.toolchain == 'hardhat'
        working-directory: app
        run: |
          pnpm hardhat node > node.log 2>&1 &
          timeout 120 node -e 'const net=require("net");(function t(){const s=net.connect(8545,"127.0.0.1");s.on("connect",()=>{s.end();process.exit(0)});s.on("error",()=>setTimeout(t,300))})()'
          node ../dist/cli.js deploy EncryptedToken --network localhost
          node -e 'const d=require("./deployments.json");if(!d.localhost.EncryptedToken.address)process.exit(1)'

  frontend:
    name: ${{ matrix.frontend }} frontend
    runs-on: ubuntu-latest
    needs: cli
    strategy:
      fail-fast: false
      matrix:
        frontend: [nextjs, vite]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Scaffold
        run: node dist/index.js app -t hardhat -f ${{ matrix.frontend }} -p encrypted-token -m pnpm --no-git --no-install -y
      - name: Install frontend dependencies
        working-directory: app/frontend
        run: pnpm install --no-frozen-lockfile
      - name: Build frontend
        working-directory: app/frontend
        run: pnpm build
